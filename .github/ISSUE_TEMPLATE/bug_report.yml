name: Bug report
description: A rule, the CLI, or the GitHub Action did the wrong thing
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. A small AGENTS.md sample that reproduces it is the most useful part of the report.

        Suggested label: `bug`.

        For a security issue, use the security policy instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the linter reported, or what it failed to report.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command, and a minimal AGENTS.md (and package.json when the finding depends on it).
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agentsmd-lint version
      description: Output of `agentsmd-lint --version`, or the git commit if you ran the source tree.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v22.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config
      description: Contents of .agentsmd-lint.json or agentsmd-lint.config.json, if you use one. Remove anything secret.
      render: json
    validations:
      required: false
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the report from `agentsmd-lint --no-color`.
      render: text
    validations:
      required: false
