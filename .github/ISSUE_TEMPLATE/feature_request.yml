name: Feature request
description: Suggest a change that is not a new lint rule
body:
  - type: markdown
    attributes:
      value: |
        Use this form for CLI, config, output, Action, or documentation changes. For a new lint rule, use the New rule form.

        Suggested label: `enhancement`.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the tool do, and how would you invoke it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Extra context
    validations:
      required: false
