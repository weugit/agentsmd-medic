# Release on version tags.
#
# The maintainer must add an NPM_TOKEN repository secret (an npm automation
# token with permission to publish agentsmd-lint) before the publish step can
# upload the package. Until that secret exists, the step skips npm publish.
# The GitHub release and the floating major tag (v0 for 0.x) are still created.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # The maintainer must add the NPM_TOKEN repository secret.
          if [[ -n "${NPM_TOKEN}" ]]; then
            npm publish --provenance --access public
          else
            echo "NPM_TOKEN is not set. Skipping npm publish."
            echo "The maintainer must add the NPM_TOKEN secret before this job can publish."
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}"

      - name: Move the major tag
        shell: bash
        run: |
          set -euo pipefail
          # Force-move the major tag (v0 for 0.x, v1 for 1.x) onto this release
          # so uses: weugit/agentsmd-lint@v0 follows the latest matching release.
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "${major}" "${GITHUB_SHA}"
          git push origin "refs/tags/${major}" --force
