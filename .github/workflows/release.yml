# Release on version tags.
#
# npm publishing uses trusted publishing (OIDC). No NPM_TOKEN secret is used.
# On npmjs.com, the agentsmd-medic package must list this trusted publisher:
#   GitHub Actions, user weugit, repository agentsmd-medic,
#   workflow filename release.yml, no environment, npm publish allowed.
# Trusted publishing needs npm CLI 11.5.1+ and Node.js 22.14+, so this job
# uses Node.js 24 and upgrades npm. Provenance is generated automatically.
# The GitHub release and the floating major tag (v0 for 0.x) are also created.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Publish to npm (trusted publishing)
        run: npm publish --provenance --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}"

      - name: Move the major tag
        shell: bash
        run: |
          set -euo pipefail
          # Force-move the major tag (v0 for 0.x, v1 for 1.x) onto this release
          # so uses: weugit/agentsmd-medic@v0 follows the latest matching release.
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "${major}" "${GITHUB_SHA}"
          git push origin "refs/tags/${major}" --force
